<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<title>Carteira</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>📈</text></svg>">
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --up:#006300;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#2a78d6; --seq-5:#256abf; --seq-6:#184f95;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --up:#0ca30c;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#2a78d6; --seq-4:#5598e7; --seq-5:#9ec5f4; --seq-6:#cde2fb;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:19px;margin:0;letter-spacing:-0.01em}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:3px}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2.4s infinite}
.live.old{background:var(--warning);animation:none}
.live.err{background:var(--critical);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}
  70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;padding:7px 13px;
  border-radius:9px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--text-primary) 6%,transparent)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:600;margin:0 0 2px}
.card .cap{font-size:12px;color:var(--muted);margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center}
.kpi .val{font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-top:4px}
.kpi .dlt{font-size:12px;color:var(--text-secondary);margin-top:2px}
.pos{color:var(--up);font-weight:600}.neg{color:var(--critical);font-weight:600}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
svg{display:block;width:100%;overflow:visible}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;
  text-align:right;padding:0 7px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 7px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--text-primary) 4%,transparent)}
.tk{font-weight:600}
.cls{font-size:11px;color:var(--muted);margin-left:6px;font-variant-numeric:normal}
.stale{font-size:10px;color:var(--warning);margin-left:5px;font-variant-numeric:normal}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;
  border-radius:999px;border:1px solid var(--border)}
.b-good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--up)}
.b-warn{background:color-mix(in srgb,var(--warning) 20%,transparent);color:var(--text-primary)}
.b-crit{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}
.hint{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex:none;
  border-radius:50%;border:1px solid var(--axis);color:var(--muted);font-size:9px;font-weight:700;
  cursor:help;margin-left:5px;line-height:1;user-select:none;font-variant-numeric:normal;vertical-align:1px}
.hint:hover,.hint:focus-visible{border-color:var(--text-primary);color:var(--text-primary);outline:none}
.tt{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface-1);
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.16);z-index:99;min-width:150px}
.tt .t{font-weight:600;margin-bottom:5px}.tt .d{color:var(--text-secondary);line-height:1.5}
.tt .r{display:flex;justify-content:space-between;gap:14px;color:var(--text-secondary)}
.tt .r b{color:var(--text-primary);font-variant-numeric:tabular-nums}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}
.vc{border:1px solid var(--border);border-radius:10px;padding:13px}
.vc .vt{font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.vr{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px;gap:8px}
.vr b{color:var(--text-primary);font-variant-numeric:tabular-nums}
.bar-track{height:5px;border-radius:3px;background:var(--grid);margin-top:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:13px;align-items:flex-start}
.alerts li:last-child{border-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--grid)}
.warnbox{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.5;
  background:color-mix(in srgb,var(--warning) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 45%,transparent)}
.empty{border:1px dashed var(--axis);border-radius:12px;padding:26px 20px;text-align:center;color:var(--muted);font-size:12.5px}
.empty b{display:block;color:var(--text-primary);font-size:14px;margin-bottom:6px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:14px 12px 48px}
  th,td{padding-left:5px;padding-right:5px;font-size:12.5px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <h1>Carteira</h1>
    <div class="status"><span class="live" id="live"></span><span id="stamp">carregando…</span></div>
  </div>
  <button class="btn" id="b-ref">Atualizar agora</button>
</header>
<div id="app"><div class="loading">Buscando dados…</div></div>
</div>
<div class="tt" id="tt"></div>

<script>
const $=id=>document.getElementById(id);
const brl=n=>'R$ '+(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const brlc=n=>'R$ '+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const n2=n=>(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=n=>(n||0).toFixed(1).replace('.',',')+'%';
const NS='http://www.w3.org/2000/svg';
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const S=k=>getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
const tt=$('tt');
function showTT(h,x,y){tt.innerHTML=h;tt.style.maxWidth='none';tt.style.minWidth='150px';tt.style.opacity=1;
 const r=tt.getBoundingClientRect();
 tt.style.left=Math.min(x+14,innerWidth-r.width-10)+'px';tt.style.top=Math.max(10,y-r.height-12)+'px'}
const hideTT=()=>tt.style.opacity=0;

const HINTS={
 lp:['L/P não realizado','Lucro ou prejuízo só de <b>preço</b>. Não inclui os proventos já recebidos — por isso ele sozinho engana.'],
 resultado:['Resultado total','L/P de preço <b>mais</b> proventos recebidos. É o número que responde "ganhei ou perdi dinheiro?".'],
 yoc:['Yield on Cost','Provento anual ÷ <b>seu preço médio</b>. Mostra o efeito de ter comprado barato; não cai quando o papel sobe.'],
 dy:['Dividend Yield','Provento anual ÷ cotação atual. É o que alguém receberia comprando hoje.'],
 pm:['Preço Médio','O que você pagou por cota, em média. Venda não altera o PM das cotas restantes — regra brasileira.'],
 renda:['Renda mensal estimada','Quantidade × provento anual ÷ 12. FII usa o rendimento médio; ação usa o dividendo dos 12 meses.'],
 valuation:['Score de valuation','Média dos sinais com dado disponível, de 0 a 100. ≥70 verde, 40–69 amarelo, abaixo de 40 vermelho. Triagem, não recomendação.'],
 atraso:['Atraso das cotações','Dados gratuitos da B3 vêm com cerca de 15 minutos de atraso. Cotação instantânea exige licença paga de market data.'],
 pvp:['P/VP','Cotação ÷ valor patrimonial por cota. Abaixo de 1 você paga menos que o valor contábil — pode ser desconto ou desconfiança do mercado.']
};
function bindHints(){document.querySelectorAll('[data-k]').forEach(n=>{
 const h=HINTS[n.dataset.k];if(!h||n.dataset.h)return;
 n.dataset.t=h[0];n.dataset.h=h[1];n.tabIndex=0;n.setAttribute('aria-label','O que significa '+h[0])})}
(function(){
 function show(n){tt.innerHTML=`<div class="t">${n.dataset.t}</div><div class="d">${n.dataset.h}</div>`;
  tt.style.maxWidth='290px';tt.style.minWidth='0';tt.style.opacity=1;
  const r=n.getBoundingClientRect(),b=tt.getBoundingClientRect();
  tt.style.left=Math.max(10,Math.min(r.left+r.width/2-b.width/2,innerWidth-b.width-10))+'px';
  tt.style.top=(r.top-b.height-9<10?r.bottom+9:r.top-b.height-9)+'px'}
 const on=e=>{const n=e.target.closest?.('[data-k]');if(n&&n.dataset.h)show(n)};
 const off=e=>{if(e.target.closest?.('[data-k]'))hideTT()};
 addEventListener('pointerover',on);addEventListener('pointerout',off);
 addEventListener('focusin',on);addEventListener('focusout',off);
 addEventListener('keydown',e=>{if(e.key==='Escape')hideTT()});
})();

/* ---------- cálculo ---------- */
const sc=m=>Math.round(50+50*Math.tanh(m*1.6));
function montar(cart,dados,hist){
 const A=(cart.ativos||[]).map(a=>{
  const d=dados.ativos?.[a.ticker]||{};
  const o={...a,px:d.preco??0,dia:d.variacaoDia??0,nome:d.nome||a.ticker,velho:!!d.desatualizado,
           semDado:d.preco==null};
  o.pos=a.quantidade*o.px; o.inv=a.quantidade*a.precoMedio;
  o.lp=o.pos-o.inv; o.recebido=a.proventosRecebidos||0; o.resultado=o.lp+o.recebido;
  o.anual = a.tipo==='FII' ? (a.rendimentoMensal||0)*12 : (a.dividendoAnual||0);
  o.dy = o.px? o.anual/o.px*100 : 0;
  o.yoc= a.precoMedio? o.anual/a.precoMedio*100 : 0;
  o.mes= a.quantidade*o.anual/12;
  o.pl = d.pl ?? a.pl ?? null;
  o.sinais=[];
  if(o.px>0){
   if(a.tipo==='ACAO'){
    const lpa=d.lpa??a.lpa, vpa=a.vpa;
    if(lpa>0&&vpa>0){const g=Math.sqrt(22.5*lpa*vpa);o.sinais.push(['Graham',brlc(g),sc((g-o.px)/g)])}
    const d3=a.dividendo3anos||o.anual;
    if(d3>0){const b=d3/0.06;o.sinais.push([a.dividendo3anos?'Bazin (3 anos)':'Bazin (12m)*',brlc(b),sc((b-o.px)/b)])}
   }else{
    if(a.pvp>0)o.sinais.push(['P/VP',n2(a.pvp),sc((1-a.pvp)*1.5)]);
    if(o.dy>0) o.sinais.push(['DY vs 10%',pc(o.dy),sc((o.dy/100-.10)*5)]);
    if(o.anual>0){const t=o.anual/0.10;o.sinais.push(['Preço teto',brlc(t),sc((t-o.px)/t)])}
   }}
  o.score=o.sinais.length?Math.round(o.sinais.reduce((s,x)=>s+x[2],0)/o.sinais.length):null;
  o.ressalva=(a.tipo==='FII'&&a.pvp>0&&a.pvp<0.8&&o.dy>14);
  if(o.ressalva&&o.score>=70)o.score=69;
  return o});
 const TOT=A.reduce((s,a)=>s+a.pos,0),INV=A.reduce((s,a)=>s+a.inv,0);
 const REC=A.reduce((s,a)=>s+a.recebido,0),MES=A.reduce((s,a)=>s+a.mes,0);
 A.forEach(a=>a.peso=TOT?a.pos/TOT*100:0);
 return{A,TOT,INV,LP:TOT-INV,REC,RES:TOT-INV+REC,MES,YOC:INV?MES*12/INV*100:0,hist,cfg:cart.config||{}};
}

/* ---------- render ---------- */
function render(D,dados){
 const ICO={good:'<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6.5 4.7 9 10 3.2"/></svg>',
  warn:'<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2v5M6 9.4v.2"/></svg>',
  crit:'<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l6 6M9 3l-6 6"/></svg>'};
 const dia=D.A.reduce((s,a)=>s+a.pos*a.dia/100,0);
 $('app').innerHTML=`
 <div class="kpis">
  <div class="kpi"><div class="lbl">Patrimônio<span class="hint" data-k="atraso">?</span></div><div class="val">${brl(D.TOT)}</div>
    <div class="dlt"><span class="${dia>=0?'pos':'neg'}">${dia>=0?'+':''}${brl(dia)}</span> hoje</div></div>
  <div class="kpi"><div class="lbl">Investido</div><div class="val">${brl(D.INV)}</div><div class="dlt">${D.A.length} ativos</div></div>
  <div class="kpi"><div class="lbl">L/P de preço<span class="hint" data-k="lp">?</span></div>
    <div class="val ${D.LP>=0?'pos':'neg'}">${brl(D.LP)}</div><div class="dlt">${pc(D.INV?(D.TOT/D.INV-1)*100:0)}</div></div>
  <div class="kpi"><div class="lbl">Proventos</div><div class="val">${brl(D.REC)}</div><div class="dlt">recebidos</div></div>
  <div class="kpi" style="border-color:color-mix(in srgb,var(--${D.RES>=0?'good':'critical'}) 45%,transparent)">
    <div class="lbl">Resultado total<span class="hint" data-k="resultado">?</span></div>
    <div class="val ${D.RES>=0?'pos':'neg'}">${D.RES>=0?'+':''}${brl(D.RES)}</div>
    <div class="dlt">${pc(D.INV?D.RES/D.INV*100:0)}&nbsp;com proventos</div></div>
  <div class="kpi"><div class="lbl">Renda mensal<span class="hint" data-k="renda">?</span></div>
    <div class="val">${brl(D.MES)}</div><div class="dlt">YoC ${pc(D.YOC)}</div></div>
 </div>

 <div class="card"><h2>Posições</h2><p class="cap">Ordenado por tamanho · cotações com ~15 min de atraso</p>
  <div style="overflow-x:auto"><table><thead><tr>
   <th>Ativo</th><th>Qtd</th><th>PM<span class="hint" data-k="pm">?</span></th><th>Atual</th><th>Dia</th>
   <th>Posição</th><th>%</th><th>L/P<span class="hint" data-k="lp">?</span></th>
   <th>Result.<span class="hint" data-k="resultado">?</span></th>
   <th>DY<span class="hint" data-k="dy">?</span></th><th>YoC<span class="hint" data-k="yoc">?</span></th>
   <th>R$/mês</th><th style="text-align:right">Valuation<span class="hint" data-k="valuation">?</span></th>
  </tr></thead><tbody>${[...D.A].sort((a,b)=>b.pos-a.pos).map(a=>{
   const k=a.score==null?['','','—']:a.score>=70?['b-good','good','Barata']:a.score>=40?['b-warn','warn','Justa']:['b-crit','crit','Cara'];
   return `<tr><td><span class="tk">${a.ticker}</span><span class="cls">${a.tipo==='FII'?'FII':'Ação'}</span>${a.velho?'<span class="stale">defasado</span>':''}</td>
    <td>${a.quantidade.toLocaleString('pt-BR')}</td><td>${n2(a.precoMedio)}</td>
    <td>${a.semDado?'—':n2(a.px)}</td>
    <td class="${a.dia>=0?'pos':'neg'}">${a.dia>=0?'+':''}${n2(a.dia)}%</td>
    <td>${brl(a.pos)}</td><td>${pc(a.peso)}</td>
    <td class="${a.lp>=0?'pos':'neg'}">${brl(a.lp)}</td>
    <td class="${a.resultado>=0?'pos':'neg'}">${a.resultado>=0?'+':''}${brl(a.resultado)}</td>
    <td>${pc(a.dy)}</td><td>${pc(a.yoc)}</td><td>${brl(a.mes)}</td>
    <td style="text-align:right">${a.score==null?'<span style="color:var(--muted)">—</span>':
      `<span class="badge ${k[0]}">${ICO[k[1]]}${a.ressalva?'Ressalva':k[2]} · ${a.score}</span>`}</td></tr>`}).join('')}
  </tbody></table></div></div>

 <div class="grid2">
  <div class="card"><h2>Evolução patrimonial</h2>
   <p class="cap" id="cap-h">—</p><div id="box-h"></div></div>
  <div class="card"><h2>Alocação</h2><p class="cap" id="cap-a">—</p><svg id="c-a" viewBox="0 0 340 250"></svg></div>
 </div>

 <div class="grid2">
  <div class="card"><h2>Renda mensal estimada</h2><p class="cap" id="cap-r">—</p>
   <svg id="c-r" viewBox="0 0 620 230"></svg>
   <div class="legend"><span><i style="background:var(--series-1)"></i>FII (isento)</span>
    <span><i style="background:var(--series-3)"></i>Ação</span></div></div>
  <div class="card"><h2>Sinais</h2><p class="cap">Recalculados a cada atualização</p><ul class="alerts" id="al"></ul></div>
 </div>

 <div class="card"><h2>Valuation</h2><p class="cap">Cada card mostra a conta. Sinal sem dado fica de fora do score.</p>
  <div class="vgrid">${D.A.map(a=>`<div class="vc">
   <div class="vt"><span>${a.ticker}</span>${a.score==null?'<span style="font-size:11px;color:var(--muted)">—</span>':
     `<span class="badge b-${a.score>=70?'good':a.score>=40?'warn':'crit'}">${a.score}</span>`}</div>
   <div style="font-size:11px;color:var(--muted);margin-top:2px">${a.setor||''} · ${brlc(a.px)}</div>
   ${a.sinais.map(s=>`<div class="vr"><span>${s[0]}</span><b>${s[1]}</b></div>
    <div class="bar-track"><div class="bar-fill" style="width:${s[2]}%;background:var(--${s[2]>=70?'good':s[2]>=40?'warning':'critical'})"></div></div>`).join('')}
   <div class="vr" style="margin-top:9px"><span>Renda/mês</span><b>${brl(a.mes)}</b></div></div>`).join('')}</div>
  <div id="wb"></div></div>

 <p class="note">Ferramenta de triagem quantitativa, não recomendação de investimento.
 Cotações via brapi.dev com atraso aproximado de 15 minutos.
 ${dados.falhas?.length?`<br><b style="color:var(--warning)">Falhas na última busca:</b> ${dados.falhas.join(' · ')}`:''}</p>`;

 /* evolução */
 const H=D.hist||[];
 if(H.length<2){
  $('cap-h').textContent='O robô guarda um ponto por dia';
  $('box-h').innerHTML=`<div class="empty"><b>${H.length?'1 dia registrado':'Aguardando o primeiro registro'}</b>
   O gráfico aparece a partir do segundo dia. Diferente de reconstruir o passado, este histórico é
   construído para frente: cada execução do robô grava patrimônio, investido e proventos do dia.</div>`;
 }else{
  $('cap-h').textContent=`${H.length} dias registrados · desde ${H[0].data.split('-').reverse().join('/')}`;
  $('box-h').innerHTML='<svg id="c-h" viewBox="0 0 620 240"></svg>';
  const svg=$('c-h'),W=620,Ht=240,L=56,R=8,T=10,B=24,iw=W-L-R,ih=Ht-T-B;
  const vals=H.flatMap(h=>[h.patrimonio,h.investido]);
  const max=Math.max(...vals)*1.03,min=Math.min(...vals)*0.97;
  const X=i=>L+i*iw/(H.length-1),Y=v=>T+ih-(v-min)/(max-min)*ih;
  for(let g=0;g<5;g++){const v=min+(max-min)*g/4,y=Y(v);
   svg.appendChild(el('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:g===0?S('axis'):S('grid'),'stroke-width':1}));
   const t=el('text',{x:L-8,y:y+4,'text-anchor':'end',fill:S('muted'),'font-size':11});
   t.textContent=Math.round(v/1000)+'k';svg.appendChild(t)}
  const path=f=>H.map((h,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(f(h)).toFixed(1)).join(' ');
  svg.appendChild(el('path',{d:path(h=>h.investido),fill:'none',stroke:S('series-2'),'stroke-width':2,'stroke-dasharray':'5 4'}));
  svg.appendChild(el('path',{d:path(h=>h.patrimonio),fill:'none',stroke:S('series-1'),'stroke-width':2}));
  [0,H.length-1].forEach(i=>{const t=el('text',{x:X(i),y:Ht-5,'text-anchor':i?'end':'start',fill:S('muted'),'font-size':11});
   t.textContent=H[i].data.slice(8)+'/'+H[i].data.slice(5,7);svg.appendChild(t)});
  const cr=el('line',{y1:T,y2:T+ih,stroke:S('axis'),'stroke-width':1,opacity:0});svg.appendChild(cr);
  const hit=el('rect',{x:L,y:T,width:iw,height:ih,fill:'transparent'});svg.appendChild(hit);
  hit.addEventListener('pointermove',e=>{const b=svg.getBoundingClientRect();
   const i=Math.max(0,Math.min(H.length-1,Math.round(((e.clientX-b.left)/b.width*W-L)/iw*(H.length-1))));
   cr.setAttribute('x1',X(i));cr.setAttribute('x2',X(i));cr.setAttribute('opacity',1);
   showTT(`<div class="t">${H[i].data.split('-').reverse().join('/')}</div>
    <div class="r"><span>Patrimônio</span><b>${brl(H[i].patrimonio)}</b></div>
    <div class="r"><span>Investido</span><b>${brl(H[i].investido)}</b></div>`,e.clientX,e.clientY)});
  hit.addEventListener('pointerleave',()=>{hideTT();cr.setAttribute('opacity',0)});
  $('box-h').insertAdjacentHTML('beforeend',
   '<div class="legend"><span><i style="background:var(--series-1)"></i>Patrimônio</span>'+
   '<span><i style="background:var(--series-2)"></i>Investido</span></div>');
 }

 /* alocação */
 const sa=$('c-a');const fii=D.A.filter(a=>a.tipo==='FII').reduce((s,a)=>s+a.pos,0);
 $('cap-a').textContent=D.TOT?`FIIs ${pc(fii/D.TOT*100)} · Ações ${pc((D.TOT-fii)/D.TOT*100)}`:'—';
 const cores=['seq-6','seq-5','seq-4','seq-3','seq-2','seq-1'];
 let dd=[...D.A].filter(a=>a.pos>0).sort((a,b)=>b.pos-a.pos);
 if(dd.length>6){const o=dd.slice(5);dd=dd.slice(0,5).concat([{ticker:'Outros',
  peso:o.reduce((s,x)=>s+x.peso,0),pos:o.reduce((s,x)=>s+x.pos,0),mes:o.reduce((s,x)=>s+x.mes,0)}])}
 const cx=104,cy=112,r=84,ir=52;let a0=-Math.PI/2;
 const arc=(a0,a1)=>{const p=(rr,a)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
  const[x1,y1]=p(r,a0),[x2,y2]=p(r,a1),[x3,y3]=p(ir,a1),[x4,y4]=p(ir,a0);const la=a1-a0>Math.PI?1:0;
  return `M${x1} ${y1}A${r} ${r} 0 ${la} 1 ${x2} ${y2}L${x3} ${y3}A${ir} ${ir} 0 ${la} 0 ${x4} ${y4}Z`};
 dd.forEach((d,i)=>{const a1=a0+d.peso/100*Math.PI*2;
  const p=el('path',{d:arc(a0+.018,Math.max(a0+.019,a1-.018)),fill:S(cores[i]),stroke:S('surface-1'),'stroke-width':2,cursor:'pointer'});
  p.addEventListener('pointermove',e=>showTT(`<div class="t">${d.ticker}</div>
   <div class="r"><span>Alocação</span><b>${pc(d.peso)}</b></div>
   <div class="r"><span>Posição</span><b>${brl(d.pos)}</b></div>`,e.clientX,e.clientY));
  p.addEventListener('pointerleave',hideTT);sa.appendChild(p);
  sa.appendChild(el('rect',{x:212,y:44+i*30,width:10,height:10,rx:3,fill:S(cores[i])}));
  const t1=el('text',{x:228,y:53+i*30,fill:S('text-secondary'),'font-size':12});t1.textContent=d.ticker;
  const t2=el('text',{x:340,y:53+i*30,fill:S('text-primary'),'font-size':12,'text-anchor':'end','font-weight':600});t2.textContent=pc(d.peso);
  sa.appendChild(t1);sa.appendChild(t2);a0=a1});
 const c1=el('text',{x:cx,y:cy-2,'text-anchor':'middle',fill:S('text-primary'),'font-size':18,'font-weight':600});c1.textContent=brl(D.TOT);
 const c2=el('text',{x:cx,y:cy+18,'text-anchor':'middle',fill:S('muted'),'font-size':11});c2.textContent=D.A.length+' ativos';
 sa.appendChild(c1);sa.appendChild(c2);

 /* renda */
 $('cap-r').textContent=`${brl(D.MES)}/mês · ${brl(D.MES*12)}/ano · YoC ${pc(D.YOC)}`;
 const sr=$('c-r');const dr=[...D.A].filter(a=>a.mes>0).sort((a,b)=>b.mes-a.mes);
 if(dr.length){const W=620,L=70,R=64,T=8,ih=214,iw=W-L-R;
  const max=Math.max(...dr.map(x=>x.mes))*1.02,step=ih/dr.length,bh=step*.6;
  sr.setAttribute('viewBox',`0 0 ${W} ${ih+16}`);
  dr.forEach((a,i)=>{const y=T+i*step+(step-bh)/2,w=a.mes/max*iw;
   const rc=el('rect',{x:L,y,width:Math.max(2,w),height:bh,rx:4,fill:S(a.tipo==='FII'?'series-1':'series-3'),cursor:'pointer'});
   rc.addEventListener('pointermove',e=>showTT(`<div class="t">${a.ticker}</div>
    <div class="r"><span>Renda/mês</span><b>${brlc(a.mes)}</b></div>
    <div class="r"><span>YoC</span><b>${pc(a.yoc)}</b></div>`,e.clientX,e.clientY));
   rc.addEventListener('pointerleave',hideTT);sr.appendChild(rc);
   const t1=el('text',{x:L-10,y:y+bh/2+4,'text-anchor':'end',fill:S('text-primary'),'font-size':12,'font-weight':600});t1.textContent=a.ticker;
   const t2=el('text',{x:L+Math.max(2,w)+9,y:y+bh/2+4,fill:S('text-secondary'),'font-size':12});t2.textContent=brl(a.mes);
   sr.appendChild(t1);sr.appendChild(t2)})}

 /* alertas */
 const AL=[],cfg=D.cfg;
 const maior=[...D.A].sort((a,b)=>b.peso-a.peso)[0];
 if(maior&&maior.peso>(cfg.alertaConcentracaoAtivo||25))
  AL.push(['critical',`<b>${maior.ticker}</b> é ${pc(maior.peso)} da carteira`,'concentração']);
 const pf=D.TOT?fii/D.TOT*100:0;
 if(pf>50)AL.push(['warning',`FIIs somam <b>${pc(pf)}</b> do patrimônio`,'concentração']);
 const set={};D.A.forEach(a=>set[a.setor||'—']=(set[a.setor||'—']||0)+a.peso);
 Object.entries(set).filter(([s,p])=>p>(cfg.alertaConcentracaoSetor||35)&&Math.abs(p-pf)>1)
  .forEach(([s,p])=>AL.push(['warning',`Setor <b>${s}</b> em ${pc(p)}`,'concentração']));
 D.A.filter(a=>a.ressalva).forEach(a=>AL.push(['warning',`<b>${a.ticker}</b>: desconto suspeito (P/VP ${n2(a.pvp)} com DY ${pc(a.dy)})`,'valuation']));
 D.A.filter(a=>a.score>=70&&!a.ressalva).forEach(a=>AL.push(['good',`<b>${a.ticker}</b> em zona de compra (score ${a.score})`,'valuation']));
 D.A.filter(a=>Math.abs(a.dia)>=3).forEach(a=>AL.push([a.dia>0?'good':'critical',`<b>${a.ticker}</b> ${a.dia>0?'subiu':'caiu'} ${pc(Math.abs(a.dia))} hoje`,'movimento']));
 if(D.LP<0&&D.RES>0)AL.push(['good',`Carteira <b>${pc((D.TOT/D.INV-1)*100)}</b> em preço, mas <b>+${pc(D.RES/D.INV*100)}</b> com proventos`,'resultado']);
 $('al').innerHTML=AL.length?AL.map(([c,h,w])=>`<li><span class="dot" style="background:var(--${c})"></span><div>${h}</div>
  <span style="color:var(--muted);font-size:12px;margin-left:auto">${w}</span></li>`).join(''):'<li style="color:var(--muted)">Nada a sinalizar.</li>';

 const rs=D.A.filter(a=>a.ressalva),bz=D.A.filter(a=>a.tipo==='ACAO'&&!a.dividendo3anos);
 let w='';
 if(rs.length)w+=`<div class="warnbox"><b>Ressalva em ${rs.map(a=>a.ticker).join(', ')}.</b>
  P/VP abaixo de 0,80 junto com DY acima de 14% costuma significar que o mercado não acredita no valor
  patrimonial declarado. O score foi travado abaixo de 70 de propósito.</div>`;
 if(bz.length)w+=`<div class="warnbox" style="background:color-mix(in srgb,var(--series-1) 10%,transparent);border-color:color-mix(in srgb,var(--series-1) 40%,transparent)">
  <b>Bazin usando 12 meses em ${bz.map(a=>a.ticker).join(', ')}.</b> A fórmula pede a média de <b>3 anos</b>.
  Preencha <code>dividendo3anos</code> no carteira.json para corrigir.</div>`;
 $('wb').innerHTML=w;
 bindHints();
}

/* ---------- carga ---------- */
async function carregar(){
 const t=Date.now();
 try{
  const [c,d,h]=await Promise.all([
   fetch('carteira.json?t='+t).then(r=>r.json()),
   fetch('dados.json?t='+t).then(r=>r.json()).catch(()=>({ativos:{}})),
   fetch('historico.json?t='+t).then(r=>r.json()).catch(()=>[]),
  ]);
  render(montar(c,d,h),d);
  const dt=d.atualizadoEm?new Date(d.atualizadoEm):null;
  const min=dt?Math.round((Date.now()-dt)/60000):null;
  $('live').className='live'+(min==null?' err':min>60?' old':'');
  $('stamp').textContent=dt
   ?`atualizado ${min<1?'agora':min<60?`há ${min} min`:`há ${Math.round(min/60)}h`} · ${dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`
   :'sem dados do robô ainda — rode o workflow na aba Actions';
 }catch(e){
  $('live').className='live err';
  $('stamp').textContent='erro ao carregar';
  $('app').innerHTML=`<div class="card"><b>Não consegui ler os arquivos.</b>
   <p class="cap" style="margin-top:8px">Isto acontece quando a página é aberta direto do disco (file://).
   Publique no GitHub Pages ou rode um servidor local:<br>
   <code>npx serve .</code> na pasta do projeto.</p>
   <p class="note">${e.message}</p></div>`;
 }
}
$('b-ref').onclick=carregar;
carregar();
setInterval(carregar,180000);                       // recarrega a cada 3 min
addEventListener('focus',()=>{                      // e ao voltar para a aba
 if(Date.now()-(window.__ultimo||0)>60000){window.__ultimo=Date.now();carregar()}});
</script>
